name: Deploy to MonsterASP.net

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0

      - name: Build
        run: dotnet build ./HotelManager.sln --configuration Release

      - name: Test
        run: dotnet test ./HotelManager.sln --no-build --configuration Release

  deploy:
    # PRs run build+tests only — deploy happens on pushes to main.
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0

      - name: Publish API
        run: dotnet publish src/HotelManager.API/HotelManager.API.csproj -c Release -r win-x86 --no-self-contained -o ./publish

      - name: Deploy to MonsterASP.net via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
